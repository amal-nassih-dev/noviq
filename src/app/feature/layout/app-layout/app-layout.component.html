<div class="app-layout">

  <app-side-bar />

  <div class="main-area">

    <app-nav-bar
      (menuToggle)="openMobileMenu()"
    />

    <main class="main-content">
      <router-outlet />
    </main>

    @if (sidebar?.isMobileOpen()) {
      <button
        type="button"
        class="mobile-sidebar-overlay"
        aria-label="Close navigation"
        (click)="sidebar.closeMobile()">
      </button>
    }

  </div>

</div>
