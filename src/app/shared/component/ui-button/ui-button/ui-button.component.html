<button
  mat-raised-button
  class="ui-btn"
  [color]="color"
  [type]="type"
  [disabled]="disabled"
  [class.ui-btn--primary]="variant === 'primary'"
  [class.ui-btn--secondary]="variant === 'secondary'"
  [class.ui-btn--ghost]="variant === 'ghost'">

  @if (icon && position === 'left') {
    <mat-icon>{{ icon }}</mat-icon>
  }

  @if (label) {
    <span>{{ label }}</span>
  }

  @if (icon && position === 'right') {
    <mat-icon>{{ icon }}</mat-icon>
  }

</button>
